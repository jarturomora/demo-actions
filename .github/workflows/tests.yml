# Nombre que se mostrará en la pestaña "Actions" del repositorio.
name: CI - Pruebas

# El workflow se ejecuta al subir cambios y al crear o actualizar un pull request.
on:
  push:
  pull_request:

# Las pruebas solo necesitan permiso para leer el contenido del repositorio.
permissions:
  contents: read

jobs:
  pruebas:
    name: Pytest con Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Descarga el código del repositorio dentro del runner de GitHub Actions.
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      # Instala Python y reutiliza la caché de pip entre ejecuciones.
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Instala exactamente las dependencias declaradas para el proyecto.
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Un código de salida distinto de cero hará que el workflow falle.
      - name: Ejecutar pruebas
        run: python -m pytest -v
